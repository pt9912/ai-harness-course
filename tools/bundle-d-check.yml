# d-check-Konfiguration für das GEBAUTE Baseline-Bundle (regelwerk/ + templates/).
#
# Warum eine eigene Datei statt `.d-check.yml` des Repos: Im Bundle liegen die
# Pfade eine Ebene flacher (`regelwerk/` statt `lab/regelwerk/`), und die Links
# sind vom Release-Rewrite bereits umgeschrieben. Genau dieser Zustand wird
# ausgeliefert — und genau er wurde bis Welle 53 nie geprüft: `make check` sieht
# den Stand VOR dem Rewrite, der Workflow zippte danach ungeprüft.
#
# Die Regelwerk-Hälfte wird SCHARF geprüft. `templates/` mischt zwei
# Referenzklassen (wie im Repo-`.d-check.yml` beschrieben):
#   (a) SYMBOLISCH — Ziel-Repo-Pfade, die erst nach dem Ausfüllen existieren
#       (`../spec/lastenheft.md`, `../AGENTS.md`, `CO-<NNN>-<titel>.md` …).
#   (b) PRÜFBAR — Verweise ins parallel vendorte `regelwerk/` (mit Ankern) und
#       template-interne Navigation.
# `keep: ["regelwerk/**"]` ist der Kern: Eine umbenannte Regelwerk-Überschrift
# verschickt sonst unbemerkt einen toten Anker ins Adopter-Repo.
#
# `spans` läuft mit, obwohl das Bundle keine Code-Pfade prüft: Ein bis zum
# Dateiende offener Fence lässt d-checks Vorverarbeitung den Rest der Datei
# überspringen — dann melden `links` und `anchors` grün, ohne geprüft zu haben
# (d-check v0.53.0, `fence-unclosed`). Das trifft hier härter als im Repo, weil
# der Release-Rewrite die Dateien anfasst: Ein Fence, der erst durch das
# Umschreiben aufgeht, ist im Repo-Stand nicht sichtbar.
scan:
  roots: ["."]
modules: [links, anchors, spans]
ignore-refs:
  - in:   "templates/**"
    refs: ["templates/**", "tools/check_*.py", "**/*.md"]
    keep: ["templates/**/*.template.md",
           "templates/README.md",
           "templates/docs/plan/adr",
           "templates/docs/plan/planning",
           "templates/.d-check.yml",
           "templates/Makefile",
           "regelwerk/**"]
