  - { datum: 2026-08-31, image: v0.71.1, neu: [], gegenstand: "Pin-Bump: der s15-Befund ist behoben, s15b + s16c drehen von still auf core-drift-vcs", ergebnis: "36 PASS, 0 FAIL, 0 KAPUTT" }
  - { datum: 2026-08-31, image: v0.71.1, neu: [s19a, s19b, s19c, s19i, s19d, s19e, s19f, s19g, s19j, s19h], gegenstand: "Entwurf: Zeitdokumente archivieren — die sechs Proben, nach Review-Mutationen nachgeschaerft", ergebnis: "46 PASS, 0 FAIL, 0 KAPUTT" }
  - { datum: 2026-09-06, image: v0.74.1, neu: [s20a, s20b, s20c, s20d, s20e, s20f], gegenstand: "Entwurf: die Sensor-Datei (Welle 120) — was der Link-Sensor faengt, seine zwei benannten Loecher, Retirierung, und das Paar Token/Pfad", ergebnis: "52 PASS, 0 FAIL, 0 KAPUTT" }
  - { datum: 2026-09-06, image: v0.74.1, neu: [s21a, s21b], gegenstand: "Entwurf: Zitier-Form im einfrierenden Artefakt (Welle 125) — Baseline-Tag springt, Link-Form rot, Token-Form gruen", ergebnis: "54 PASS, 0 FAIL, 0 KAPUTT" }
