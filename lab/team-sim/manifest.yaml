# Team-Sim-Manifest (Modul-12-Bauform: was den Lauf rekonstruierbar macht).
# Ins Manifest gehoert, was den Lauf BESTIMMT — nicht, was er erzeugt.
runner: run.sh                       # bash run.sh [sNN ...]; Verdikte = Erwartungen unten
seed: seed/                          # fester Baum, keine Zeitstempel in Erwartungen;
                                     # Hash je Lauf im Kopf von ergebnis.tsv
runtime:
  image: ghcr.io/pt9912/d-check      # Digest zur Laufzeit aus ../../Makefile (DCHECK_DIGEST):
  digest_source: ../../Makefile      # eine Quelle, kein zweiter Pin; der benutzte Digest
                                     # steht im Kopf jeder ergebnis.tsv
  env: { network: none, git: ">= 2.43", topologie: "bare origin.git + Clones alice, bob" }
expectations_ref: run.sh             # die Erwartung steht bei jedem Verdikt (2. Argument)
                                     # und als Satz in README §Szenarien
results: "$WORK/ergebnis.tsv"        # je Verdikt: szenario, erwartet, beobachtet, PASS|FAIL|KAPUTT
# Gruppen (= Auswahl-Kennungen) und ihre Verdikte, in Lauf-Reihenfolge:
gruppen:
  s01: [s01, s01b]                   # Doppel-Anspruch auf main: laut vor der Arbeit
  s02: [s02]                         # gleiche Nummer, zwei Branches: still
  s03: [s03]                         # Register-Doppelzeile mit Abstand: still
  s04: [s04a, s04b, s04e, s04f, s04i, s04g, s04h, s04c, s04d]   # Offene Wellen: Singleton vs. Bijektion; Marker-Haelfte
  s05: [s05]                         # MR-Hybrid: Dateien still, Index-Zeile laut
  s06: [s06]                         # Branch-Protection: TA-7-Anspruch scheitert
  s07: [s07]                         # Sichtung liest den gemergten Stand
  s08: [s08a, s08b]                  # Closure unter Anspruch: schlampig laut, sauber still
  s09: [s09]                         # Vorvergabe aus dem Wellen-Plan anderswo gezogen: still
  s10: [s10a, s10b]                  # Inhaber-Feld: beide -> Konflikt; Uebernahme -> still
  s11: [s11a, s11b]                  # doc-immutable (vcs, Range): Geschichte frei, Kern core-drift-vcs
  # s12-s18: ENTWURFS-Gegenstand (Verzeichnisform des Registers, docs/steering-loop-team.md
  # §Naechster belastbarer Schritt) — nicht der gelehrte Korpus. Seed unveraendert.
  s12: [s12]                         # zwei Belege, zwei PRs: Merge addiert die Dateien
  s13: [s13]                         # derselbe Namespace/Slug: add/add-Konflikt, laut
  s14: [s14a, s14b]                  # 1x + 1x + 1x = 3x erst im Merge-Stand: still
  s15: [s15a, s15b, s15c]            # Pfadidentitaet: beide Eingabe-Modi melden den Rename (seit v0.71.1)
                                     # PIN-GEBUNDEN: s15b + s16c erwarten den FIX aus v0.71.1. Unter < v0.71.1
                                     # sind beide wieder still — Erwartungen dann zurueckdrehen.
  s16: [s16a, s16b, s16c]            # Beleg geaendert/geloescht/umbenannt: core-drift-vcs
  s17: [s17]                         # zwei Slugs fuer dasselbe Phaenomen: still (bewusste Grenze)
  s18: [s18a, s18b]                  # Alias-Gruppe und Alias-Zyklus: still
  # s19: ENTWURF Zeitdokument-Archiv (docs/zeitdokument-archiv.md) — erste
  # Szenarien ohne Nebenlaeufigkeits-Gegenstand: eine Operation und ihr Sensor.
  s19: [s19a, s19b, s19c, s19i, s19d, s19e, s19f, s19g, s19j, s19h]
  # s20: ENTWURF Sensor-Datei (Welle 120, grundlagen/harness-dateien.md
  # §harness/README.md als Einstiegspunkt) — wie s19 ohne Nebenlaeufigkeits-
  # Gegenstand. Seed unveraendert; die Form legen die Szenarien selbst an.
  s20: [s20a, s20b, s20c, s20d, s20e, s20f]
  # s21: ENTWURF Zitier-Form im einfrierenden Artefakt (Welle 125). Akzeptanz-
  # kriterium aus dem CR von ai-harness-init: Link-Form rot, Token-Form gruen.
  s21: [s21a, s21b]
  # s22: ENTWURF zweite Traceability-Richtung (Welle 127). Bericht und Gate sind
  # derselbe Lauf (--trace / --trace --require-complete); und erst ein Slice
  # entlastet eine Anforderung, eine ADR nicht.
  s22: [s22a, s22b, s22c, s22d]
  # s23: ENTWURF der EINE Gate-Index (Welle 129). Autoritaet ist der Index, nicht
  # das Briefing; die Code-Span der Target-Zelle traegt den nackten Namen.
  s23: [s23a, s23b, s23c, s23e, s23d]
# Laeufe: Datum, Image, neuer Satz, Ergebnis — der Beleg ist die ergebnis.tsv des Laufs.
laeufe:
