# Replay-Manifest für welle-1-baseline.
# Layout und Feldgewichtung entsprechen Kurs Modul 12, Worked Example A; der
# Messgegenstand ist ein Inferenz-Modell wie in Worked Example B. Gemischter
# Fall: Die `inputs/` sind Such-Anfragen, das Embedding-Modell laeuft im Replay
# mit und steht darum in `model:`. Weil der Lauf einen Seed hat, traegt
# `model.seed` — und die Regeln der nachgelagerten Ranking-Stufe stehen im
# `determinism:`-Block darunter, nicht in einem `prompt_context:`.

set_name: welle-1-baseline
slice: welle-1-mvp
description: >
  Baseline-Replays für DocSearch nach Welle-1-Abschluss.
  Drei Cases decken Happy Path, Boundary und Negative je LH-FA-02 ab.

recorded_at: 2026-06-02T16:42:00Z

model:
  name: local-embed-v3
  version: "2026-05-22"
  seed: 42

runtime:
  # Aufgezeichnet gegen die Referenz-Sprache der Welle 1 (Go); die fünf
  # übrigen Skelette replayen dasselbe Set, ihre Toolchains stehen in
  # ihren eigenen Manifesten.
  implementation: go
  image_hash: sha256:abc123def4567890abc123def4567890abc123def4567890abc123def4567890
  toolchain:
    go: "1.23"        # Implementierung
    python: "3.12.4"  # vorgesehen für den Replay-Runner (CO-002, slice-015)
  env:                # was der Image-Hash nicht pinnt
    tz: UTC
    locale: C.UTF-8
    network: none
    cpu_count: 4
  timestamp_masking: fixed

# Pfade relativ zu diesem Manifest.
inputs_ref: inputs/
expectations_ref: expectations/

# Determinismus-Anker, gelten für alle Cases dieses Sets.
determinism:
  seed_derivation: substream_je_fall                                # der Seed allein reicht nicht
  tie_break_strategy: sort_stable_then_doc_path_then_section_index  # siehe ADR-0003 + slice-009
  max_topk: 100                                                     # siehe LH-FA-02 Boundary
  embedding_dim: 1024

# Verifikations-Erwartung: zwei Läufe identischer Eingabe müssen
# byte-identische `actual.results`-Listen erzeugen (Reihenfolge auch
# bei gleichen Scores).
#
# CO-002 — DEKLARIERT, NICHT DURCHGESETZT. Im Lab führt `make replay` keinen
# Lauf aus; es validiert nur die Struktur dieses Verzeichnisses. Kein Target
# vergleicht Hashes, und `runtime.image_hash` wird gegen nichts gehalten.
# Der Block steht als Ziel-Form hier, weil Modul 12 ihn als Pflichtinhalt
# eines Replay-Manifests lehrt. Auflösung: slice-015-replay-runner.
verification:
  per_case_hash: sha256
  determinism_check: two_runs_same_hash

notes: >
  Bei Modell-Wechsel: top_score_min und top_doc_path-Erwartung neu
  kalibrieren, top_section_title_contains bleibt semantischer Anker.
