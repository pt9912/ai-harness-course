# .a-check.yml — Layering des C#-Skeletts als deklarierte Architektur
# (ADR-0001, Gate-Bindung ADR-0018). Zweites Gate neben den NetArchTest-Fakten
# in tests/DocSearch.Tests/ArchitectureTests.cs: dasselbe Layering, andere
# Ausdrucksform — Konfiguration statt Test-Framework.
#
# Layer-Reihenfolge aus ADR-0001: Types -> Index -> Embedding -> Audit ->
# Service -> UI. Audit ist dort deklariert, aber in keinem Skelett gebaut und
# hat deshalb hier keine Schicht.
# Namespace und Ordner decken sich (.NET-Konvention), deshalb traegt jede
# Schicht genau ein Verzeichnis.
#
# GRENZE dieses Skeletts, vom Bestandssensor gedeckt: a-check liest
# `using`-Direktiven und sieht einen voll qualifizierten Typzugriff ohne
# `using` nicht. NetArchTest sieht ihn, weil es die kompilierte Assembly liest
# — gemessen. Deshalb keine Zusatzregel hier.
version: 1
languages:
  csharp: ["**/*.cs"]

# Keine Rollen: Das C#-Skelett ist geschichtet, nicht ports-und-adapters — der
# Service spricht Index und Embedding direkt an. `role: app` wuerde genau das
# als app-impurity melden und eine Architektur behaupten, die hier nicht
# gebaut ist. Geprueft wird deshalb nur die Kanten-Richtung.
layers:
  types:     ["src/DocSearch/Types/**"]
  index:     ["src/DocSearch/Index/**"]
  embedding: ["src/DocSearch/Embedding/**"]
  service:   ["src/DocSearch/Service/**"]
  ui:        ["src/DocSearch/UI/**"]

# Allow-Liste: Was nicht steht, ist verboten. Damit sind die vier
# NetArchTest-Fakten gedeckt und zusaetzlich die Kanten, die dort keine Regel
# haben — Types importiert nichts, Index nicht Embedding.
edges:
  - {from: ui,        to: service}
  - {from: ui,        to: types}
  - {from: service,   to: index}
  - {from: service,   to: embedding}
  - {from: service,   to: types}
  - {from: index,     to: types}
  - {from: embedding, to: types}

# Program.cs verdrahtet Index, Embedding und Service — Composition Root.
composition_root: ["src/DocSearch/Program.cs"]

# `using DocSearch.Service;` ist ein gepunkteter Namespace; ohne diese
# Zuordnung auf den Verzeichnisbaum loest kein using auf eine Schicht auf und
# das Gate waere still gruen.
resolution:
  csharp: {mode: fixed-root, roots: ["src/DocSearch"], package_base: "DocSearch"}

# tests/ prueft absichtlich quer durch die Schichten. bin/ und obj/ sind
# gitignoriert, liegen lokal aber im Baum — ohne Ausschluss saehe der lokale
# Lauf mehr als ein frischer Checkout.
exclude:
  - "tests/**"
  - "**/bin/**"
  - "**/obj/**"
  - "TestResults/**"
