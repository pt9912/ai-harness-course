# Referenz-Richtung (Kurs §Referenz-Richtung) als Deklaration, geprueft vom
# d-check-Modul `matrix`. Ersetzt tools/check_references.py (slice-022): Das
# Skript trug zwei Zellen der Matrix und erklaerte die dritte — ADR -> Slice —
# fuer nicht grep-bar. Der Kurs loest sie ueber den umgekehrten Default: Die
# Kante gilt als verboten, die Ausnahme wird am Ort deklariert.
#
# NUR `matrix`. Link- und Anker-Pruefung laeuft an der Kurs-Wurzel, die den
# ganzen Baum sieht: Dieses Verzeichnis ist ein Teilbaum und verlinkt bewusst
# in den Kurs; ein `links`-Lauf in diesem Scope meldete 63 Repo-Escapes.
scan:
  # Ganzes Beispiel, nicht nur spec/ und docs/plan/: Die ADR-Kennungen stehen
  # auch in AGENTS.md, den sechs harness/README.md und den Skelett-AGENTS.md.
  # Mit engeren Wurzeln waere die Linkpflicht dort unbemerkt verletzbar — im
  # Break-Test aufgefallen, nicht beim Konfigurieren.
  roots: ["."]
  ignore: ["**/build/**", "**/build-cov/**", "**/target/**", "**/.gradle/**"]
modules: [matrix, targets, planning, ids]

matrix:
  classes:
    # Die drei Spec-Straten. Sie duerfen ADR und Slice in KEINEM Abschnitt
    # nennen — auch nicht in ihrer Historie; deshalb steht `Historie` unten
    # nicht in `exclude-sections`.
    - name: spec
      paths: ["spec/lastenheft.md", "spec/spezifikation.md", "spec/architecture.md"]
    - name: adr
      paths: ["docs/plan/adr/[0-9]*.md"]
      token: 'ADR-\d{4}'
    # `token` faengt die Kennung auch als blossen Text — eine Referenz muss
    # kein Link sein.
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      token: 'slice-\d{3}'
  rules:
    # Kontext-Zeiger sind erlaubt und werden am Ort markiert
    # (<!-- d-check:status-provenance -->); alles Uebrige faellt.
    - {from: adr,  to: slice, allow: false}
    # Decken-Regel der Spec-Straten (Kurs §Referenz-Richtung, Regel 5).
    - {from: spec, to: adr,   allow: false}
    - {from: spec, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
    # Die Abloesung steht in diesem Korpus in der Status-Zeile ("Superseded by
    # ADR-NNNN"), nicht in einem Supersedes-Feld. Ohne beide Feldnamen meldete
    # jede korrekt abgeloeste ADR-Kette einen Dauerbefund auf ihrer eigenen
    # Lineage.
    allow-supersede-lineage: true
    supersede-fields: [Supersedes, Status]
  # Vor Einfuehrung dieser Konvention entstandene ADRs werden grandfathered,
  # nicht nachgezogen (Kurs §Referenz-Richtung, Absatz Mechanisierbar).
  # Einzeln statt als Bereichs-Glob: Ein Treffer in einer anderen Alt-ADR soll
  # auffallen, nicht still mitgedeckt sein.
  exempt-paths:
    - "docs/plan/adr/0011-*.md"
    - "docs/plan/adr/0012-*.md"
    - "docs/plan/adr/0013-*.md"
  # Provenance in der ADR-Historie ist Kontext (Regel 5) — die Sektion heisst
  # hier `Geschichte`. `Historie` gehoert NICHT dazu: So heisst nur die Sektion
  # der Spec-Straten, und fuer die gilt die Ausnahme ausdruecklich nicht.
  exclude-sections: [Geschichte]

# Deklarations-Konsistenz Doku <-> Build-Targets. AGENTS.md §3 nennt
# halluzinierte Gates "die haeufigste Form von Harness-Luege" und beruft sich
# auf `make help` als autoritative Liste — bis hierher pruefte das niemand.
# Zwei Richtungen: jedes in einer Doku-Tabelle behauptete `make X` ist eine
# reale Regel (gate-phantom), und jede Regel steht in der Autoritaets-Doku
# (gate-undocumented).
targets:
  # Beide Tabellen aus AGENTS.md §3 zusammen: die Skelett-Targets leben in
  # <sprache>/Makefile, die repo-weiten hier.
  makefiles:
    - Makefile
    # Das Gate-Fragment traegt `doc-check` selbst.
    - d-check.mk
    - cpp/Makefile
    - csharp/Makefile
    - go/Makefile
    - java/Makefile
    - kotlin/Makefile
    - python/Makefile
  # GRENZE: nur die oberste AGENTS.md. Die sechs <sprache>/AGENTS.md und die
  # sechs <sprache>/harness/README.md tragen ebenfalls Sensors-Tabellen —
  # laut AGENTS.md §4 sogar die Stelle, an der ein Gate DEFINIERT ist —, und
  # ein Phantom-Target dort bleibt unentdeckt. Nachgestellt. Die andere
  # Richtung (gate-undocumented) greift ueber alle Makefiles.
  doc-tables: [AGENTS.md]
  authority: AGENTS.md
  # Utility ohne Doku-Pflicht: Sie tragen kein Gate, und AGENTS.md §3 listet
  # bewusst die Gates, nicht jede Regel. Exakte Namen, kein Glob.
  exempt-targets:
    - help
    - build
    - run
    - clean
    - toolchain
    - configure
    - a-check
    - a-check-graph
    # Die uebrigen Regeln des tool-generierten Fragments: optionale
    # d-check-Laeufe, die dieses Repo nicht als Gate fuehrt. Bewusst
    # einzeln — bringt ein d-check-Release ein neues Target mit, meldet
    # es der Sensor, und jemand entscheidet.
    - doc-check
    - doc-trace
    - doc-complete
    - doc-doctor
    - doc-repair
    - doc-immutable
    - doc-commits
    - doc-planning
    - doc-tracked
    - doc-targets
    - doc-help

# Planning-Lifecycle-Invariante: Der Ruhe-Marker steht im Block
# `## Aktuelle Welle` genau dann, wenn kein Slice im Roadmap-Verzeichnis
# liegt. Haelt zusammen, was sonst beim `git mv` auseinanderlaeuft — der
# Zustand ergibt sich aus dem Verzeichnis, die Roadmap darf ihm nicht
# widersprechen.
planning:
  roadmap: docs/plan/planning/in-progress/roadmap.md
  # Zweite Faehigkeit desselben Moduls: die STRUKTUR der Closure-Notizen im
  # Ruheort — dieselbe Aussage, die `tools/check_closure_notes.py` prueft, an
  # denselben acht Dateien und mit denselben vier Bedingungen (12 Break-Tests,
  # je beide Sensoren am selben Fund). Das Skript bleibt trotzdem: Es ist der
  # Vergleichsgegenstand des Worked Example von Kurs-Modul 11 und wird von dort
  # per Pfad verlinkt. Seine Existenz ist didaktisch begruendet, nicht durch
  # Deckung — die traegt seit d-check v0.56.0 dieses Modul allein.
  closure:
    dir: docs/plan/planning/done
    # Kandidaten-Menge = ALLE Dateien im Ruheort, nicht nur die Slices.
    # ADR-0011 §Geschichte zaehlt `welle-1-mvp.md` ausdruecklich zu den Dateien,
    # fuer die die Pflicht gilt; `slice-*.md` waere unter-gefasst.
    glob: '*.md'
    # Die Schwelle ist eine ENTSCHEIDUNG, keine Einstellung: ADR-0011
    # §Entscheidung 1 sagt "mindestens zwei Saetze". d-checks Default ist 4 —
    # ein Gate schaerfer als seine bindende ADR, und genau daran scheiterte
    # zuerst `welle-1-mvp.md`, dessen §7 laut `welle.template.md` ein Zeiger auf
    # die Ergebnis-Notiz ist und keine Notiz.
    min-sentences: 2
    # Um Ebene 1 geweitet gegenueber dem Default `^#{2,3} `: Die Welle-Ergebnis-
    # notiz fuehrt ihre Bestimmung im TITEL (`welle-results.template.md` beginnt
    # mit `# Welle <NN> — <Titel> — Closure-Notiz`). Ohne die Weitung meldet
    # ausgerechnet die Datei `closure-note-missing`, die die Notiz IST.
    # `Closure-Trigger` und `Offene Risiken zur Welle-Closure` bleiben draussen,
    # weil das Muster die Notiz benennen muss.
    heading-pattern: '^#{1,3} .*Closure-Notiz'
    # Vierte Bedingung (d-check v0.55.0, opt-in): der unausgefuellte Rumpf einer
    # Vorlage. Ein Template-Rumpf ist syntaktisch vollstaendig und passiert die
    # drei anderen Bedingungen — Abschnitt da, Schwelle erreicht, keine Floskel.
    # Inline-Code zaehlt nicht mit, dort wird Syntax GEZEIGT; genau daran hing
    # die Falsch-Positiv-Sorge des abgeloesten Skripts (`p95 < 1 s`).
    placeholder: true
    # Vollstaendig uebernommen aus `tools/check_closure_notes.py`. Bis v0.55.0
    # gingen nur acht der zehn Phrasen: d-check matchte den literalen Substring,
    # `ok` traf damit in `dokumentiert`. Seit v0.56.0 vergleicht das Modul an
    # WORTGRENZEN, und beide sind benutzbar — die Vorbedingung des Handbuchs
    # (null Treffer im Bestand) ist mit der neuen Lexik nachgezaehlt.
    boilerplate:
      - "see pr"
      - "n/a"
      - "ok"
      - "siehe ticket"
      - "wird nachgereicht"
      - "fertig"
      - "läuft jetzt"
      - "lauft jetzt"
      - "war ganz okay"
      - "passt schon"

# Linkpflicht fuer ADR-Kennungen. Nicht Kosmetik: `matrix` prueft den STATUS
# eines Ziels nur an Links — eine nackte Kennung im Fliesstext ist fuer das
# Gate unsichtbar. Gemessen: `ADR-0015` (superseded) nackt in einem Slice
# -> 0 Befunde, derselbe Verweis als Link -> matrix-inactive. `ids` erzwingt
# den Link, `matrix` beurteilt ihn.
#
# Nur die ADR-Klasse. LH-*/slice-* sind ebenfalls linkpflichtig-wuerdig
# (89 weitere Stellen), aber das ist eigene Aufraeum-Arbeit — ein Modul wird
# hier erst scharf, wenn seine Klasse sauber ist.
#
# Zwei Ausnahmen stehen als Zeilen-Marker im Text, nicht als Pfad-Liste:
# geplante Vorwaerts-Verweise (ADR-0004, die slice-014 erst bringt) und
# Protokollzeilen in Geschichte-Sektionen, in denen ein Link rotten wuerde
# (Kurs §Referenz-Richtung, Regel 5).
ids:
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
    # LH-Kennungen zeigen aufwaerts ins Lastenheft — Ziel und Anker sind
    # stabil. `docs/plan/adr/**` ist ausgenommen, und zwar zwingend: Jede ADR
    # ist `Accepted` oder `Superseded`, und einen Link im Koerper zu ergaenzen
    # ist eine Kern-Aenderung (AGENTS.md §2.5). Nachgestellt — `make
    # doc-immutable` meldet dafuer `core-drift-vcs`. Die 19 nackten Nennungen
    # dort sind nicht Nachlaessigkeit, sondern unzulaessig zu beheben.
    - regex: 'LH-(FA|QA)-\d{2}'
      target: spec/lastenheft.md
      exempt-paths: ["docs/plan/adr/**"]

# KEINE Linkpflicht fuer `slice-NNN`. Der Kurs nennt die Slice-ID einen
# "stabilen Token, auch nachdem die Datei nach done/ wandert" — ein Pfad-Link
# macht sie instabil: Jeder Zustandswechsel per `git mv` braeche ihn repo-weit.
# Im ganzen Beispiel gibt es deshalb keinen einzigen Slice-Link, und das bleibt
# so.
