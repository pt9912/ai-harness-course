# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check) — ersetzt
# die Link-/Anker-/Pfad-Prüfungen von tools/docs-check.js
# (Pilot-Migration 2026-06-12, JS-Familie). docs-check.js bleibt als
# Rest-Sensor für die semantischen Modul-Nummern-Checks (Prüfung A/B).
scan:
  roots: ["."]
  # CHANGELOG = historisches Register: Verweise sind zeitpunkt-korrekt (nennen
  # Dateien, wie sie zur jeweiligen Welle existierten, z. B. retired
  # agents-regelwerk.md) — nicht gegen den aktuellen Stand prüfen.
  ignore: ["lab/example/cpp/build-cov/**", ".tmp/**", "CHANGELOG.md"]
modules: [links, anchors, codepaths, matrix]

# lab/templates mischt ZWEI Referenzklassen in denselben Dateien:
#   (a) SYMBOLISCH — Ziel-Repo-Pfade, die erst nach dem Ausfüllen existieren
#       (../spec/lastenheft.md, ../AGENTS.md, harness/conventions.md,
#       CO-<NNN>-<titel>.md, tools/check_*.py …). Lösen im Kurs-Repo NICHT auf.
#   (b) PRÜFBAR — Verweise ins Regelwerk (../regelwerk/…, mit Ankern) und
#       template-interne Navigation (*.template.md, README.md, adr/, planning/).
# Früher stand das ganze Verzeichnis in scan.ignore — das opferte Klasse (b).
# Seit Welle 37 zeigen die Verweise auf das parallel vendorte Regelwerk statt in
# den Kurs (netzlos im Bundle); sie MÜSSEN geprüft bleiben — eine umbenannte
# Regelwerk-Überschrift verschickt sonst unbemerkt einen toten Anker ins
# Adopter-Repo.
# scoped ignore-refs (in:/refs:/keep:) ignoriert nur (a), prüft (b) scharf.
# ignoriert  <=>  refs ∧ ¬keep  (keep gewinnt, reihenfolge-unabhängig).
ignore-refs:
  - in:   "lab/templates/**"
    refs: ["lab/templates/**", "tools/check_*.py"]
    keep: ["lab/templates/**/*.template.md",
           "lab/templates/README.md",
           "lab/templates/docs/plan/adr",
           "lab/templates/docs/plan/planning",
           "lab/templates/.d-check.yml",
           "lab/templates/Makefile"]


# Referenz-Richtung (Kurs §Referenz-Richtung) fuer das Beispiel-Repo, soweit
# maschinell entscheidbar. Bisher trug `lab/example/tools/check_references.py`
# zwei Zellen der Matrix und erklaerte die dritte — ADR -> Slice — fuer nicht
# grep-bar. Der Kurs loest das ueber den umgekehrten Default: Die Kante gilt als
# verboten, die Ausnahme wird am Ort deklariert. Genau diese Bauform hat
# d-check als Modul `matrix`.
matrix:
  classes:
    - {name: adr, paths: ["lab/example/docs/plan/adr/[0-9]*.md"]}
    # `token` faengt die Kennung auch als blossen Text im Fliesstext — eine
    # Referenz muss kein Link sein.
    - name: slice
      paths: ["lab/example/docs/plan/planning/**/slice-*.md"]
      token: 'slice-\d{3}'
  rules:
    # Kontext-Zeiger sind erlaubt und werden am Ort markiert
    # (<!-- d-check:status-provenance -->); alles Uebrige faellt.
    - {from: adr, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
    # Die Ablloesung steht in diesem Korpus in der Status-Zeile
    # ("Superseded by ADR-NNNN"), nicht nur in einem Supersedes-Feld. Ohne
    # beide Feldnamen meldete jede korrekt abgeloeste ADR-Kette einen
    # Dauerbefund auf ihrer eigenen Lineage.
    allow-supersede-lineage: true
    supersede-fields: [Supersedes, Status]
  # Vor Einfuehrung dieser Konvention entstandene ADRs werden grandfathered,
  # nicht nachgezogen (Kurs §Referenz-Richtung, Absatz Mechanisierbar).
  # Bewusst einzeln statt als Bereichs-Glob: Ein Treffer in einer anderen
  # Alt-ADR soll auffallen, nicht still mitgedeckt sein.
  exempt-paths:
    - "lab/example/docs/plan/adr/0011-*.md"
    - "lab/example/docs/plan/adr/0012-*.md"
    - "lab/example/docs/plan/adr/0013-*.md"
  # Provenance in der Historie ist Kontext (Kurs §Referenz-Richtung, Regel 5).
  exclude-sections: [Geschichte, Historie]

codepaths:
  roots: [lab, kurs, tools]
  # Tombstone: agents-regelwerk.md ist retired (Welle 24, Split kanonisch);
  # historische CHANGELOG-Verweise dürfen dangeln, ohne die Historie zu editieren.
  # Tombstone: konventionen.md ist auf sechs Seiten geschnitten (Welle 63/64);
  # Review-Reports zitieren sie mit Zeilennummern als historischen Beleg und
  # werden dafür nicht editiert.
  ignore-refs: ["kurs/de/agents-regelwerk.md",
                "kurs/de/grundlagen/konventionen.md",
                "lab/regelwerk/grundlagen-konventionen.md"]
