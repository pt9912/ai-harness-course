# Durchsetzungsschicht für die Kurs-Validatoren: dieselben Targets wie
# lokal (`make docs-check` / `make alignment-check`), Docker-basiert —
# lokal und im CI identisch (Modul 14). Ein Gate, das nur lokal läuft,
# ist ein Vorschlag (Modul 13).
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Markdown-Links, Anker, Pfade, Modul-Nummern
        run: make docs-check

  alignment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lernziel-Alignment (strict, WARN = rot)
        run: make alignment-check ARGS="--strict"

  # `make check` sieht das Beispiel-Repo nicht: Es traegt eine eigene
  # `.d-check.yml` mit vier Modulen (matrix, targets, planning, ids) und daneben
  # den Vorfuehr-Gegenstand aus Modul 11. Beides lief bis hierher nur lokal —
  # also nach dem Satz oben ein Vorschlag, kein Gate. Der Lauf ist hermetisch
  # (Container digest-gepinnt, `--network none`), deshalb ist der Job ein
  # einzelner make-Aufruf und keine Nachbildung.
  example-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Referenz-Richtung, Gate-Deklarationen, Planning-Lifecycle, Closure-Notizen
        run: make -C lab/example verify

  # ADR-Immutabilitaet braucht eine Commit-Range, deshalb ein eigener Job und
  # nicht `make check`.
  #
  # Laeuft auf BEIDE Ereignisse. Nur am Pull Request waere der Job in diesem
  # Repo wirkungslos: Die Historie kennt keinen gemergten PR, hier wird direkt
  # nach main gepusht — und ein Gate, das nie feuert, ist ein Vorschlag
  # (Kommentar oben).
  adr-immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Range bestimmen
        id: range
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # merge-base statt base.sha: `base.sha` ist der Basis-Stand vom
            # letzten PR-Ereignis. Waechst main zwischenzeitlich, lagen fremde
            # Commits in der Range und eine dort geaenderte ADR wuerde diesem
            # PR angelastet.
            BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BASE="${{ github.event.before }}"
            # Beim ersten Push eines Branches ist `before` lauter Nullen, nach
            # einem Force-Push kann der Commit fehlen. Dann nur den letzten
            # Commit pruefen statt fail-closed abzubrechen.
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1)
            fi
          fi
          echo "value=$BASE..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "Range: $BASE..${{ github.sha }}"
      - name: ADRs sind nach Accepted immutable (AGENTS.md §2.5)
        run: make doc-immutable RANGE=${{ steps.range.outputs.value }}
