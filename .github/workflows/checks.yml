# Durchsetzungsschicht für die Kurs-Validatoren: dieselben Targets wie
# lokal (`make docs-check` / `make alignment-check`), Docker-basiert —
# lokal und im CI identisch (Modul 14). Ein Gate, das nur lokal läuft,
# ist ein Vorschlag (Modul 13).
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Markdown-Links, Anker, Pfade, Modul-Nummern
        run: make docs-check

  alignment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lernziel-Alignment (strict, WARN = rot)
        run: make alignment-check ARGS="--strict"

  # ADR-Immutabilitaet braucht eine Commit-Range, deshalb ein eigener Job und
  # nicht `make check`. Nur am Pull Request: Dort liefert `base.sha` einen
  # verlaesslichen Bezugspunkt, waehrend `github.event.before` beim ersten Push
  # eines Branches Nullen ist. Pushes nach main kommen aus gemergten PRs und
  # sind dort bereits geprueft.
  adr-immutability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: ADRs sind nach Accepted immutable (AGENTS.md §2.5)
        run: make doc-immutable RANGE=${{ github.event.pull_request.base.sha }}..${{ github.sha }}
