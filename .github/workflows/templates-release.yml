# Stabiler, login-freier Download des Regelwerks als self-contained Baseline:
# bei einem Release-Tag (`vX.Y.Z`, historisch `templates-v*`) wird EIN Baseline-ZIP
# (`regelwerk/` + `templates/` parallel; Modul- und `../templates/`-Verweise reisen
# relativ mit, nur Außen-Verweise auf den Tag gepinnt) als Release-Asset angehängt.
# Wer nur die Skelette will, nimmt `templates/` aus dem Bundle.
# Permanente URL: …/releases/latest/download/lab-regelwerk.zip
# (Ergänzung zum Actions-Artifact aus templates-zip.yml, das pro Änderung auf main
# eine Template-Vorschau liefert, aber Login erfordert und nach 90 Tagen verfällt.)
name: templates-release

on:
  push:
    tags: ["v[0-9]*", "templates-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Assemblierung liegt in tools/build-bundle.sh, damit `make bundle-check`
      # lokal BYTEGLEICH dasselbe Artefakt erzeugt — eine Nachbildung prüft
      # nicht das, was ausgeliefert wird.
      - name: Baseline-Bundle bauen (self-contained — regelwerk/ + templates/)
        run: make bundle-build DEST="$RUNNER_TEMP/baseline" REF="$GITHUB_REF_NAME"
      # Der Wächter, der bis Welle 53 fehlte: `make check` sieht die Links VOR
      # dem Release-Rewrite, gezippt wurde danach ungeprüft. Ein Rewrite-Fehler
      # oder ein Link, der erst durch das Umschreiben bricht, ging unbemerkt an
      # jeden Adopter. Läuft VOR dem Zippen — geprüft werden die Bytes, die
      # gleich im ZIP landen.
      - name: Bundle-Referenzen prüfen (Links + Anker im ausgelieferten Stand)
        run: make bundle-verify DEST="$RUNNER_TEMP/baseline"
      - name: ZIP packen
        run: ( cd "$RUNNER_TEMP/baseline" && zip -r "$GITHUB_WORKSPACE/lab-regelwerk.zip" . )
      # Prüfsumme als eigenes Asset: Der Tag allein ist kein Anker — er ist
      # verschiebbar, und das Asset ist ersetzbar. Wer die Baseline vendort,
      # kann mit SHA256SUMS festhalten, WAS er vendort hat, und es spaeter
      # gegenpruefen (Modul 14, Archiv-Form des Reproduzierbarkeits-Ankers).
      - name: Pruefsumme erzeugen
        run: sha256sum lab-regelwerk.zip > SHA256SUMS
      - name: Release anlegen, Assets anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lab-regelwerk.zip SHA256SUMS \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes "ZIP-Stand beim Tag \`$GITHUB_REF_NAME\`. \`lab-regelwerk.zip\` = self-contained Baseline (\`regelwerk/\` 17 Module + Grundlagen-Rahmen + README, \`templates/\` parallel) — nach \`.harness/baseline/$GITHUB_REF_NAME/\` entpacken, dann lösen die \`../templates/\`-Ziel-Form-Verweise netzlos auf. Wer nur die Skelette will, nimmt \`templates/\` aus dem Bundle."
