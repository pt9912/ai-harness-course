# Stabiler, login-freier Download für lab/templates und das Regelwerk:
# bei einem Release-Tag (`vX.Y.Z`, historisch `templates-v*`) werden das Templates-ZIP
# und ein Regelwerk-pro-Modul-ZIP (interne Links auf den Tag gepinnt) als
# Release-Assets angehängt.
# Permanente URLs: …/releases/latest/download/lab-templates.zip,
# …/releases/latest/download/lab-regelwerk.zip
# (Ergänzung zum Actions-Artifact aus templates-zip.yml, das pro
# Änderung auf main eine Vorschau liefert, aber Login erfordert und
# nach 90 Tagen verfällt.)
name: templates-release

on:
  push:
    tags: ["v[0-9]*", "templates-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Kurs-Verweise auf den Tag pinnen
        run: bash tools/rewrite-template-links.sh lab/templates "$GITHUB_REF_NAME"
      - name: ZIP bauen
        run: |
          cd lab/templates
          zip -r "$GITHUB_WORKSPACE/lab-templates.zip" .
      - name: Regelwerk-ZIP bauen (self-contained — Außen-Verweise auf den Tag pinnen)
        run: |
          tmp="$RUNNER_TEMP/regelwerk"
          mkdir -p "$tmp"
          cp lab/regelwerk/*.md "$tmp/"
          # Modul-Querverweise bleiben relativ (--keep-within-src); nur Verweise
          # nach außen (Kurs, Templates, Beispiel, LICENSE) werden gepinnt.
          for f in "$tmp"/*.md; do
            python3 tools/rewrite-doc-links.py "$f" lab/regelwerk "$GITHUB_REF_NAME" . --keep-within-src
          done
          ( cd "$tmp" && zip -r "$GITHUB_WORKSPACE/lab-regelwerk.zip" . )
      - name: Release anlegen, Assets anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lab-templates.zip lab-regelwerk.zip \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes "ZIP-Stand von \`lab/templates\` und \`lab/regelwerk\` (17 Module + Grundlagen-Rahmen + README) beim Tag \`$GITHUB_REF_NAME\`."
