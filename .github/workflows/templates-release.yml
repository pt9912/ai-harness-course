# Stabiler, login-freier Download des Regelwerks als self-contained Baseline:
# bei einem Release-Tag (`vX.Y.Z`, historisch `templates-v*`) wird EIN Baseline-ZIP
# (`regelwerk/` + `templates/` parallel; Modul- und `../templates/`-Verweise reisen
# relativ mit, nur Außen-Verweise auf den Tag gepinnt) als Release-Asset angehängt.
# Wer nur die Skelette will, nimmt `templates/` aus dem Bundle.
# Permanente URL: …/releases/latest/download/lab-regelwerk.zip
# (Ergänzung zum Actions-Artifact aus templates-zip.yml, das pro Änderung auf main
# eine Template-Vorschau liefert, aber Login erfordert und nach 90 Tagen verfällt.)
name: templates-release

on:
  push:
    tags: ["v[0-9]*", "templates-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Templates auf den Tag pinnen (Kurs-Verweise — fürs Baseline-Bundle)
        run: bash tools/rewrite-template-links.sh lab/templates "$GITHUB_REF_NAME"
      - name: Regelwerk-Baseline-ZIP bauen (self-contained — regelwerk/ + templates/)
        run: |
          tmp="$RUNNER_TEMP/baseline"
          mkdir -p "$tmp/regelwerk"
          cp lab/regelwerk/*.md "$tmp/regelwerk/"
          # Templates parallel ins Bundle (im Schritt "Kurs-Verweise … pinnen"
          # bereits auf den Tag gepinnt), damit die `../templates/`-Ziel-Form-
          # Verweise der Splits NETZLOS auflösen: regelwerk/ ↔ templates/ liegen
          # parallel wie lab/regelwerk ↔ lab/templates im Kurs-Repo.
          cp -r lab/templates "$tmp/templates"
          # Splits: Modul-Querverweise (--keep-within-src) UND `../templates/`-
          # Verweise (--keep-within=lab/templates) bleiben relativ; nur echte
          # Außen-Verweise (Kurs, LICENSE) werden auf den Tag gepinnt.
          for f in "$tmp/regelwerk"/*.md; do
            python3 tools/rewrite-doc-links.py "$f" lab/regelwerk "$GITHUB_REF_NAME" . --keep-within-src --keep-within=lab/templates
          done
          ( cd "$tmp" && zip -r "$GITHUB_WORKSPACE/lab-regelwerk.zip" . )
      - name: Release anlegen, Assets anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lab-regelwerk.zip \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes "ZIP-Stand beim Tag \`$GITHUB_REF_NAME\`. \`lab-regelwerk.zip\` = self-contained Baseline (\`regelwerk/\` 17 Module + Grundlagen-Rahmen + README, \`templates/\` parallel) — nach \`.harness/baseline/$GITHUB_REF_NAME/\` entpacken, dann lösen die \`../templates/\`-Ziel-Form-Verweise netzlos auf. Wer nur die Skelette will, nimmt \`templates/\` aus dem Bundle."
