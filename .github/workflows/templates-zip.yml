# Stellt lab/templates (Artifact `lab-templates`) als Vorschau-Artifact bereit.
# Läuft bei Änderung an Templates oder Rewrite-Tool auf main; workflow_dispatch
# erlaubt manuelles Neu-Erzeugen, da Artifacts nach 90 Tagen verfallen.
name: templates-zip

on:
  push:
    branches: [main]
    paths:
      - "lab/templates/**"
      - "tools/rewrite-doc-links.py"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Kurs-Verweise auf den Vorschau-Stand (main) pinnen
        run: bash tools/rewrite-template-links.sh lab/templates main
      - name: Templates als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lab-templates
          path: lab/templates
          if-no-files-found: error
          retention-days: 90
